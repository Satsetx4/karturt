name: Test Gate A

on:
  push:
    branches:
      - "verify/**"
      - "feat/phase-4-resident-card"
      - "fix/phase-4-1-resident-card-cleanup"
      - "feat/phase-4-5-audit-core-readiness"
      - "feat/phase-5-payment-request"
      - "fix/phase-5-1-pre-verification-hardening"
      - "feat/phase-6-treasurer-verification"
      - "feat/phase-7-reject-cancel"
      - "fix/phase-7-1-post-resolution-lifecycle"
      - "feat/phase-8-cash-payment"
      - "feat/phase-9-payment-reversal"
      - "feat/phase-10-waiver"
      - "feat/phase-11-tariff-adjustment"
      - "feat/phase-12-household-management"
      - "feat/phase-13-reports"
      - "fix/phase-13-1-acceptance-closure"
      - "feat/launch-safety-single-rt"
      - "integrate/f12-clean-checkpoint"
      - "main"
    paths-ignore:
      - "docs/test-gate-a-report.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-a:
    name: Gate A local verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      DATABASE_ENV: test
      DATABASE_URL: postgresql://karturt:ci-only-not-a-secret@localhost:5432/karturt_ci
      BETTER_AUTH_SECRET: ci-build-only-secret-never-valid-for-deployment-0000000000
      NEXT_PUBLIC_APP_URL: https://example.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit -- --maxWorkers=1
      - name: Integration and migration tests
        run: npm run test:integration -- --maxWorkers=1
      - name: Database constraint tests
        run: npm run test:constraints -- --maxWorkers=1
      - name: Authorization tests
        run: npm run test:authorization -- --maxWorkers=1
      - name: Full test suite
        run: npm test -- --maxWorkers=1
      - name: Drizzle migration journal consistency
        run: npx drizzle-kit check
      - name: Drizzle schema drift check
        run: |
          npm run db:generate -- --name gate_a_ci_drift
          git diff --exit-code -- drizzle
          if test -n "$(git status --porcelain --untracked-files=all -- drizzle)"; then
            echo "Schema drift generated untracked migration files."
            exit 1
          fi
      - name: Production build
        env:
          APP_ENV: production
          DATABASE_ENV: production
          DATABASE_URL: postgresql://karturt:ci-only-not-a-secret@localhost:5432/karturt_ci
          BETTER_AUTH_SECRET: ci-build-only-secret-never-valid-for-deployment-0000000000
          NEXT_PUBLIC_APP_URL: https://example.invalid
        run: npm run build

  launch-safety-postgres-concurrency:
    if: github.ref == 'refs/heads/feat/launch-safety-single-rt' || github.head_ref == 'feat/launch-safety-single-rt'
    name: Launch Safety independent PostgreSQL concurrency
    needs: gate-a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: karturt_concurrency_test
          POSTGRES_USER: karturt_concurrency_test
          POSTGRES_PASSWORD: local-test-only-not-a-deployment-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karturt_concurrency_test -d karturt_concurrency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Independent PostgreSQL concurrency proof
        env:
          LAUNCH_SAFETY_POSTGRES_URL: postgresql://karturt_concurrency_test:local-test-only-not-a-deployment-secret@127.0.0.1:5432/karturt_concurrency_test
        run: npm run test:postgres-concurrency
      - name: Upload concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-safety-postgres-concurrency-${{ github.sha }}
          path: docs/launch-safety-evidence/postgres-independent-concurrency.json
          if-no-files-found: ignore
          retention-days: 14


name: Test Gate A

on:
  push:
    branches:
      - "verify/gate-a-neon-ci"
      - "verify/gate-c-financial-invariants"
      - "verify/karturt-v1-rc-wave13b1s-20261015"
      - "verify/karturt-wave13a2-pg18-20261014"
      - "verify/krt-07-combined-2026-10-11"
      - "verify/karturt-v1-rc-quality-wave13b1t-20261015"
      - "codex/karturt-v1-staging-activation-20261015"
      - "codex/karturt-wave13b2-f2-fail-closed-20261017"
      - "feat/phase-4-resident-card"
      - "fix/phase-4-1-resident-card-cleanup"
      - "feat/phase-4-5-audit-core-readiness"
      - "feat/phase-5-payment-request"
      - "fix/phase-5-1-pre-verification-hardening"
      - "feat/phase-6-treasurer-verification"
      - "feat/phase-7-reject-cancel"
      - "fix/phase-7-1-post-resolution-lifecycle"
      - "feat/phase-8-cash-payment"
      - "feat/phase-9-payment-reversal"
      - "feat/phase-10-waiver"
      - "feat/phase-11-tariff-adjustment"
      - "feat/phase-12-household-management"
      - "feat/phase-13-reports"
      - "feat/delivery-readiness-single-rt"
      - "fix/phase-13-1-acceptance-closure"
      - "feat/launch-safety-single-rt"
      - "fix/launch-safety-security-closure"
      - "fix/v1-post-demo-billing-20261012"
      - "integrate/f12-clean-checkpoint"
      - "main"
    paths-ignore:
      - "docs/test-gate-a-report.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-a:
    name: Gate A local verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      DATABASE_ENV: test
      DATABASE_URL: postgresql://karturt:ci-only-not-a-secret@localhost:5432/karturt_ci
      BETTER_AUTH_SECRET: ci-build-only-secret-never-valid-for-deployment-0000000000
      NEXT_PUBLIC_APP_URL: https://example.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit -- --maxWorkers=1
      - name: Integration and migration tests
        run: npm run test:integration -- --maxWorkers=1
      - name: Database constraint tests
        run: npm run test:constraints -- --maxWorkers=1
      - name: Authorization tests
        run: npm run test:authorization -- --maxWorkers=1
      - name: Launch Security Closure tests
        run: npm run test:security-closure -- --maxWorkers=1
      - name: Full test suite
        run: npm test -- --maxWorkers=1
      - name: Drizzle migration journal consistency
        run: npm run db:check:offline
      - name: Drizzle schema drift check
        run: |
          npm run db:generate:offline -- --name gate_a_ci_drift
          git diff --exit-code -- drizzle
          if test -n "$(git status --porcelain --untracked-files=all -- drizzle)"; then
            echo "Schema drift generated untracked migration files."
            exit 1
          fi
      - name: Production build
        env:
          APP_ENV: production
          DATABASE_ENV: production
          DATABASE_URL: postgresql://karturt:ci-only-not-a-secret@localhost:5432/karturt_ci
          BETTER_AUTH_SECRET: ci-build-only-secret-never-valid-for-deployment-0000000000
          NEXT_PUBLIC_APP_URL: https://example.invalid
        run: npm run build

  wave13b2-query-integrity-windows:
    if: github.ref == 'refs/heads/codex/karturt-v1-staging-activation-20261015' || github.head_ref == 'codex/karturt-v1-staging-activation-20261015' || github.ref == 'refs/heads/codex/karturt-wave13b2-f2-fail-closed-20261017' || github.head_ref == 'codex/karturt-wave13b2-f2-fail-closed-20261017'
    name: Wave 13B.2 query hash and Windows LF checkout
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Configure Windows autocrlf
        shell: pwsh
        run: git config --global core.autocrlf true
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify raw Git blob and Windows checkout bytes
        shell: pwsh
        run: |
          if ((git config --get core.autocrlf) -ne 'true') { throw 'Windows autocrlf is not enabled for this checkout.' }
          node scripts/verify-wave13b2-query-integrity.mjs
  launch-safety-postgres-concurrency:
    if: github.ref == 'refs/heads/verify/krt-07-combined-2026-10-11' || github.head_ref == 'verify/krt-07-combined-2026-10-11' || github.ref == 'refs/heads/feat/launch-safety-single-rt' || github.head_ref == 'feat/launch-safety-single-rt' || github.ref == 'refs/heads/fix/launch-safety-security-closure' || github.head_ref == 'fix/launch-safety-security-closure' || github.ref == 'refs/heads/feat/delivery-readiness-single-rt' || github.head_ref == 'feat/delivery-readiness-single-rt' || github.ref == 'refs/heads/fix/v1-post-demo-billing-20261012' || github.head_ref == 'fix/v1-post-demo-billing-20261012' || github.ref == 'refs/heads/codex/karturt-v1-wave2-candidate-20261012' || github.head_ref == 'codex/karturt-v1-wave2-candidate-20261012' || github.ref == 'refs/heads/verify/karturt-v1-rc-wave13b1s-20261015' || github.head_ref == 'verify/karturt-v1-rc-wave13b1s-20261015' || github.ref == 'refs/heads/verify/karturt-v1-rc-quality-wave13b1t-20261015' || github.head_ref == 'verify/karturt-v1-rc-quality-wave13b1t-20261015' || github.ref == 'refs/heads/codex/karturt-v1-staging-activation-20261015' || github.head_ref == 'codex/karturt-v1-staging-activation-20261015'
    name: Launch Safety independent PostgreSQL concurrency
    needs: gate-a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: karturt_concurrency_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_USER: karturt_runner_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_PASSWORD: local-test-only-not-a-deployment-secret
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U karturt_runner_${{ github.run_id }}_${{ github.run_attempt }} -d karturt_concurrency_${{ github.run_id }}_${{ github.run_attempt }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Initialize run-scoped PostgreSQL identity
        env:
          APP_ENV: test
          DATABASE_ENV: test
          LAUNCH_SAFETY_POSTGRES_URL: postgresql://karturt_runner_${{ github.run_id }}_${{ github.run_attempt }}:local-test-only-not-a-deployment-secret@127.0.0.1:${{ job.services.postgres.ports[5432] }}/karturt_concurrency_${{ github.run_id }}_${{ github.run_attempt }}
        run: npm run prepare:postgres-concurrency-ci
      - name: Independent PostgreSQL concurrency proof
        env:
          APP_ENV: test
          DATABASE_ENV: test
          LAUNCH_SAFETY_POSTGRES_URL: postgresql://karturt_runner_${{ github.run_id }}_${{ github.run_attempt }}:local-test-only-not-a-deployment-secret@127.0.0.1:${{ job.services.postgres.ports[5432] }}/karturt_concurrency_${{ github.run_id }}_${{ github.run_attempt }}
          LAUNCH_SAFETY_POSTGRES_EVIDENCE_PATH: ${{ runner.temp }}/postgres-independent-concurrency-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: npm run test:postgres-concurrency:runner
      - name: Upload concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-safety-postgres-concurrency-${{ github.sha }}
          path: ${{ runner.temp }}/postgres-independent-concurrency-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: ignore
          retention-days: 14

